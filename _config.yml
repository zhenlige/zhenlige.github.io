exclude:
-   package.json
-   package-lock.json
-   README.md
-   rollup.config.js
-   src/

disqus:
    shortname: zhenlige # 占位符，实际使用giscus评论系统

collections:
    posts:
        output: true
        permalink: /blog/:year-:month-:day/:title
    drafts:
        output: true
        permalink: /blog/draft/:title

defaults:
-   scope:
        path: ""
    values:
        layout: default
        license: CC BY-SA 4.0
        license_url: https://creativecommons.org/licenses/by-sa/4.0/
-   scope:
        path: ""
        type: pages
    values:
        layout: page
-   scope:
        path: ""
        type: posts
    values:
        layout: post_custom
-   scope:
        path: ""
        type: drafts
    values:
        layout: post_custom
        comments: false

plugins:
-   jektex
-   jekyll-archives
-   jekyll-feed
-   jekyll-seo-tag
-   jekyll-sitemap

jektex:
    katex_options:
        output: mathml

jekyll-archives:
    enabled:
        - categories
        - tags
    layouts:
        category: archives
        tag: archives
    permalinks:
        category: /blog/category/:name/
        tag: /blog/tag/:name/

theme: minima
minima:
    skin: auto

timezone: Asia/Shanghai
lang: zh-CN

author: 真理哥
email: 2149292144@qq.com

title: 真理哥的博客
description: 个人博客/技术/geek/数学/计算机